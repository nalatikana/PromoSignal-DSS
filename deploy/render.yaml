# ตั้งค่าสำหรับ Render (แผนฟรี) — ยังไม่ได้เปิดใช้
# วิธีใช้: ย้ายไฟล์นี้ไปไว้ที่รากของ repo แล้วเชื่อม repo กับ Render
services:
  - type: web
    name: promosignal-dss
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false          # ตั้งเป็น true เมื่อพร้อมให้ deploy อัตโนมัติทุกครั้งที่ push
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
# ข้อควรรู้ของแผนฟรี: เครื่องจะหลับเมื่อไม่มีคนใช้ ~15 นาที
# คำขอแรกหลังหลับจะช้าราว 30–60 วินาที ถ้าจะสาธิตให้กรรมการดู ควรเปิดหน้าเว็บทิ้งไว้ก่อนสัก 1 นาที
